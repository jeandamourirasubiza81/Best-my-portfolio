<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact- Jean d'Amour</title>
    <style>
       *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        body{
            background-color:#071D2B; 
            font-family: Arial, Helvetica, sans-serif;
            color: white;
        }
        .navigation{
            display: flex;
            height: 80px;
            align-items: center;
            justify-content: space-between;
            padding: 0px 70px;
        }
        .logo{
            display: flex; 
            font-size: 32px;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
            letter-spacing: 2px;
          
        }
        .logo span{
            color:  #F75702;

        }
        .logo b{
            color: #fff;
        }
        .logo i{
            color:#0EB4F7;
            font-style: normal;
        }
        .menu{
            display: flex;
            list-style: none;
            align-items: center;
            gap: 25px;

        }
        .menu li a{
            text-decoration: none;
            color: #fff;
            font-weight: 500;
            padding: 7px 5px;
        }
        .menu li a:hover{
            background-color: #F75702;
            border-radius: 5px;
        }
        .menu li a:active{
            color: #0EB4F7;
        }
        h2{
            font-size: 32px;
            text-align: center;
             margin-bottom: 35px;
        }
        h2 span{
            color: #F75702;
        }
      .contact {
    width: 90%;
    max-width: 900px;
    margin: 40px auto;
}

.container {
    width: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 22px;
    margin-bottom: 35px;
}
.location,
.email,
.call {
    padding: 10px 15px;
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 70px;
}

.icon {
    width: 45px;
    height: 45px;
    border: 3px solid #ff5a00;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}
.icon i {
    font-size: 20px;
    color: #00e5ff;
}
.container h3 {
    margin-bottom: 5px;
    font-size: 16px;
}
.container p {
    font-size: 13px;
}

.contact-form {
    width: 100%;
}
.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.contact-form label {
    display: block;
    margin-bottom: 5px;
    font-weight: bold;
}

.contact-form input,
.contact-form textarea {
    width: 100%;
    border: none;
    outline: none;
    background: #343b4e;
    color: white;
    border-radius: 10px;
    padding: 15px;
    margin-bottom: 20px;
}

.contact-form input {
    height: 50px;
}


.contact-form textarea {
    height: 170px;
    resize: none;
}

.contact-form input::placeholder,
.contact-form textarea::placeholder {
    color: white;
}

.send {
    display: block;
    margin: 5px auto;
    background: #ff5a00;
    color: white;
    border: none;
    border-radius: 10px;
    padding: 14px 45px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}


.send:hover {
    background: white;
    color: #f75702;

}




    </style>
</head>
<body>
    <header class="navigation">
        <div class="logo">
            <span>J</span>.<b>D</b>.<i>I</i>
        </div>
        <ul class="menu">
            <li><a href="./index.html">Home</a></li>
            <li><a href="./About.html">About</a></li>
            <li><a href="./Service.html">Service</a></li>
            <li><a href="./Skills.html">Skills</a></li>
            <li><a href="./Education.html">Education</a></li>
            <li><a href="./Blogs.html">Blogs</a></li>
            <li><a href="./Project.html">Projects</a></li>
            <li><a href="./Contacts.html">Contact</a></li>
            <li><a href="./Login.html">Login</a></li>
            <li><a href="./Sign up.html">Sign Up</a></li>
           
        </ul>

    </header>
  <section class="contact">

    <h2>Our <span>Contacts</span></h2>

    
    <div class="container">

       
        <div class="location">
            <div class="icon">
                <i class="fa-solid fa-location-dot"></i>
            </div>

            <div>
                <h3>My Address</h3>
                <p>Kigali, Rwanda</p>
            </div>
        </div>


        
        <div class="email">
            <div class="icon">
                <i class="fa-solid fa-envelope"></i>
            </div>

            <div>
                <h3>Email</h3>
                <p>jeandamourirasubiza81@gmail.com</p>
            </div>
        </div>


        
        <div class="call">
            <div class="icon">
                <i class="fa-solid fa-phone"></i>
            </div>

            <div>
                <h3>Call Me</h3>
                <p>
                    +250794444287<br>
                    +250791918918
                </p>
            </div>
        </div>

    </div>


   
    <form class="contact-form">

        <div class="form-row">

            <div>
                <label for="name">Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Your Name"
                    required>
            </div>

            <div>
                <label for="phone">Phone</label>
                <input
                    type="tel"
                    id="phone"
                    placeholder="07xxxxxx"
                    required>
            </div>

        </div>


        <label for="email">Email</label>

        <input
            type="email"
            id="email"
            placeholder="jean@gmail.com"
            required>


        <label for="message">Message</label>

        <textarea
            id="message"
            placeholder="Write your message..."
            required></textarea>


        <button type="submit" class="send">
            Send Message
        </button>

    </form>

</section>
<script>

const form = document.querySelector(".contact-form");

form.addEventListener("submit", function(event) {

    event.preventDefault();

    alert("Message sent successfully!");

    form.reset();

});
</script>

    });
</script>
</body>
</html>
