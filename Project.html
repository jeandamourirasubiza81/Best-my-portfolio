            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
            padding: 60px;

        .Container{

            display: flex;
            justify-content: center;
            align-items: center;
            gap:35px;
        }
        .Container .project { 
            width: 350px; 
            padding: 0;
              border-radius: 15px;
               overflow: hidden;
        }

        .Container .project img {
             width: 100%;
              height: 330px;
               object-fit: cover; 
               display: block;
        }
        .Container .project:hover { 
            transform: translateY(-10px); 
            border: 4px solid #ff5a00;
        }
        .footer {
            padding: 25px 8%;

            background: #061824;
        }

        .footer p {
            color: #fff;
            font-size: 13px;

        .social-links {
            display: flex;
            justify-content: center;
            gap: 18px;
            margin-bottom: 15px;

        .social-links a {
            width: 40px;
            height: 40px;
            display: grid;
            place-items: center;
            border: 1px solid #F95703;
            border-radius: 50%;
            color: var(--cyan);
            transition: 0.3s;
            text-decoration: none;
        }

        .social-links a:hover {

            color: white;
